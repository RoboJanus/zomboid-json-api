<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#121417"/>
            <stop offset="1" stop-color="#0f1113"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)"/>
    <rect width="100%" height="100%" fill="url(#grid)" opacity="0.6"/>

    <!-- Title -->
    <text x="256" y="250" text-anchor="middle" font-family="Orbitron, 'Arial Narrow', sans-serif" font-weight="700" font-size="88" fill="#00a6ff" style="letter-spacing:1px">
        JSON API
    </text>
    <text x="256" y="310" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="20" fill="#cfe8ff" opacity="0.6">
        File-based API for custom server interactions.
    </text>
</svg>
