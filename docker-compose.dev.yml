# Local PZ server for mod development
# Usage: docker-compose -f docker-compose.dev.yml up
#
# Mounts the local repo (mod.info + media/) directly into the dev-mods directory.
# The server's DEPLOY_DEV_MODS mechanism wires it into the Workshop structure at startup.
#
# Connect your PZ client to: localhost:16261
#
# After making Lua changes, restart the container:
#   docker-compose -f docker-compose.dev.yml restart pz-dev
#
# Prerequisites:
#   - Docker login to ECR: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 970547363058.dkr.ecr.us-east-2.amazonaws.com
#   - Create a secrets.env file with: ADMIN_PASSWORD=<your_password> and RCON_PASSWORD=<your_password>

services:
  pz-dev:
    image: 970547363058.dkr.ecr.us-east-2.amazonaws.com/onyx/zomboid:prod
    container_name: pz-local-dev
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    environment:
      - DEPLOY_DEV_MODS=true
      - SERVER_NAME=KLICKALACK
      - MEMORY_XMX_GB=4
      - MEMORY_XMS_GB=2
      - ADMIN_USERNAME=admin
    env_file:
      - secrets.env
    volumes:
      - ./:/zomboid/dev-mods/json-api
      - pz-dev-data:/project-zomboid
      - pz-dev-config:/project-zomboid-config

volumes:
  pz-dev-data:
  pz-dev-config:
